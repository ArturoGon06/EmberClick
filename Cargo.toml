[package]
name = "emberclick"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight cross-platform auto clicker"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
enigo = { version = "0.6.1", features = ["wayland"] }
global-hotkey = "0.8.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
